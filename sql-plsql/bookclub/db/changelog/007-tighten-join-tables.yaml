databaseChangeLog:
  - changeSet:
      id: evolve-book-reading-not-null
      author: alline
      changes:
        - addNotNullConstraint:
            tableName: book_reading
            columnName: book_id
            columnDataType: uuid

        - addNotNullConstraint:
            tableName: book_reading
            columnName: member_id
            columnDataType: uuid

  - changeSet:
      id: evolve-book-rating-not-null
      author: alline
      changes:
        - addNotNullConstraint:
            tableName: book_rating
            columnName: book_id
            columnDataType: uuid

        - addNotNullConstraint:
            tableName: book_rating
            columnName: member_id
            columnDataType: uuid

        - addNotNullConstraint:
            tableName: book_rating
            columnName: rating
            columnDataType: int
