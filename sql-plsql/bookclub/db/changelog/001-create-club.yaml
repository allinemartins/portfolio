databaseChangeLog:
  - changeSet:
      id: 001-create-club
      author: alline
      changes:
        - createTable:
            tableName: club
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: club
            columnNames: name
            constraintName: uk_club_name
