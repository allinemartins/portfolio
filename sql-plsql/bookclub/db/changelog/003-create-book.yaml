databaseChangeLog:
  - changeSet:
      id: 003-create-book
      author: alline
      changes:
        - createTable:
            tableName: book
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: club_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false

              - column:
                  name: author
                  type: varchar(150)
                  constraints:
                    nullable: false

              - column:
                  name: image_url
                  type: varchar(500)

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_book_club
            baseTableName: book
            baseColumnNames: club_id
            referencedTableName: club
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            tableName: book
            indexName: idx_book_club
            columns:
              - column:
                  name: club_id

        - sql:
            sql: |
              ALTER TABLE book
              ADD CONSTRAINT ck_book_status
              CHECK (status IN ('SUGGESTED','READING','READ'));
